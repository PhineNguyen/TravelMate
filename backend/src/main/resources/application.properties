spring.application.name=travelmate-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/travelmate}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.config.import=optional:file:.env
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.jwt.secret=${APP_JWT_SECRET:TravelMateJwtSecretKeyTravelMateJwtSecretKeyTravelMateJwtSecretKey}
app.jwt.access-token-minutes=${APP_JWT_ACCESS_TOKEN_MINUTES:120}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:nguyenquangtien2005z@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

openweathermap.api.key=${OPENWEATHERMAP_API_KEY:{OPENWEATHER_API_KEY}}
openweathermap.api.url=${OPENWEATHERMAP_API_URL:https://api.openweathermap.org/data/2.5}

ai-service.url=${AI_SERVICE_URL:http://localhost:8000}

